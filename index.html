<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e6bd6">
<title>사진 일기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>사진 일기</h1>
    <button id="btnSync" hidden>원드라이브 연결</button>
    <button id="btnSettings" title="API 키 설정">설정</button>
    <button id="btnExport">백업 저장</button>
    <button id="btnImport">백업 불러오기</button>
    <button id="btnNew" class="primary">+ 새 기록</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </header>
  <p class="note" id="keyNote" hidden></p>

  <!-- 설정 -->
  <section class="panel" id="settings" hidden>
    <h2>설정</h2>
    <div class="fields">
      <div>
        <label for="kakaoKey">카카오 JavaScript 키</label>
        <input type="text" id="kakaoKey" autocomplete="off" spellcheck="false" placeholder="카카오 개발자 사이트 → 내 애플리케이션 → 앱 키">
        <div class="hint">주변 가게 찾기에 필요해요. 카카오 개발자 사이트의 플랫폼 → Web에 이 앱 주소(<span id="originText"></span>)를 등록해야 동작해요.</div>
      </div>
      <div>
        <label for="claudeKey">Claude API 키</label>
        <input type="password" id="claudeKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
        <div class="hint">사진을 보고 가게 종류(예: 짬뽕 → 중국집)를 알아낼 때 써요. 비워두면 주변 음식점·카페를 가까운 순서로만 보여줘요. 키는 이 기기에만 저장돼요.</div>
      </div>
      <div class="row">
        <button id="btnSettingsClose">닫기</button>
        <button id="btnSettingsSave" class="primary">저장</button>
      </div>
    </div>
  </section>

  <!-- 편집기 -->
  <section class="panel" id="editor" hidden>
    <div class="editor-grid">
      <div class="slots">
        <div class="slot main" data-slot="0" tabindex="0">대표 사진<br>클릭 또는 끌어놓기</div>
        <div class="slot" data-slot="1" tabindex="0">추가 사진 1</div>
        <div class="slot" data-slot="2" tabindex="0">추가 사진 2</div>
        <div class="slot" data-slot="3" tabindex="0">추가 사진 3</div>
        <div class="slot" data-slot="4" tabindex="0">추가 사진 4</div>
      </div>
      <div class="fields">
        <div>
          <label for="fDate">날짜</label>
          <input type="date" id="fDate">
          <div class="hint" id="dateHint">대표 사진을 올리면 촬영 날짜가 자동으로 들어갑니다.</div>
        </div>

        <div class="locbox" id="locBox">
          <div class="locline">
            <span id="locText">위치: 대표 사진을 올리면 찍은 위치를 읽어요.</span>
            <button class="small" id="btnHere">현재 위치 사용</button>
          </div>
          <div id="suggestStatus" class="hint"></div>
          <div id="map" class="map" hidden></div>
          <ol id="candidates" class="candidates"></ol>
        </div>

        <div>
          <label for="fPlace">장소 / 제목</label>
          <input type="text" id="fPlace" placeholder="예: 미사장 — 위 후보를 누르면 자동으로 들어가요">
        </div>
        <div>
          <label for="fMemo">메모</label>
          <textarea id="fMemo" placeholder="간단하게 적어주세요"></textarea>
        </div>
        <div class="row">
          <button id="btnCancel">취소</button>
          <button id="btnSave" class="primary">저장</button>
        </div>
      </div>
    </div>
    <input type="file" id="pick" accept="image/*" hidden>
  </section>

  <main id="list"></main>
</div>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
